name: sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync]

concurrency:
  group: sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sync
        id: sync
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Existing secret chat + personal alert recipient.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }},124962083
        run: |
          set -o pipefail
          python sync.py 2>&1 | tee /tmp/sync.log
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Include caches too; leaving them dirty broke pull --rebase and blocked cfg push.
          git add out/cfg.txt cache/
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh"
          git pull --rebase --autostash origin main
          git push
