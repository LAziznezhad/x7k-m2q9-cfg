name: sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: sync
        id: sync
        run: |
          set -o pipefail
          python sync.py 2>&1 | tee /tmp/sync.log
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/cfg.txt
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh"
            git pull --rebase origin main
            git push
          fi
      - name: telegram count
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT=$(python3 - <<'PY'
          from pathlib import Path
          lines=[l for l in Path('out/cfg.txt').read_text(encoding='utf-8', errors='replace').splitlines() if l.strip()]
          print(len(lines))
          PY
          )
          MSG=$(printf 'x7k sync OK\ncount: %s\nrun: %s' "$COUNT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          curl -fsS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "disable_web_page_preview=true" >/dev/null
          echo "telegram count=$COUNT"
      - name: telegram on begzar failure
        if: failure() && steps.sync.conclusion == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          ERR=$(tail -c 1200 /tmp/sync.log 2>/dev/null || echo "sync failed (no log)")
          MSG=$(printf 'x7k sync FAILED\nrepo: LAziznezhad/x7k-m2q9-cfg\nrun: %s\n\n%s' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$ERR")
          curl -fsS --max-time 20 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "disable_web_page_preview=true" >/dev/null
          echo "telegram notified"
